<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Wassim Bizid — Cybersecurity &amp; GRC leader</title>
  <desc id="d">Governance, identity and Zero Trust, security operations and AI governance. CISSP, CISM, ITIL, Executive Mini-MBA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.55" stop-color="#F4FAFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2F80ED" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#CFE4F2"/>

  <!-- Layered rings: governance, identity, operations around a protected core -->
  <g transform="translate(1010 150)" fill="none">
    <circle r="112" stroke="#2F80ED" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="84" stroke="#24445D" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="56" stroke="#2F80ED" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M0 -32 L26 -21 V4 C26 20 14 31 0 37 C-14 31 -26 20 -26 4 V-21 Z" fill="#2F80ED" fill-opacity="0.12" stroke="#2F80ED" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-11 2 L-3 10 L13 -8" stroke="#24445D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="0" r="6" fill="#2F80ED"/>
    <circle cx="-59" cy="-60" r="5" fill="#24445D" fill-opacity="0.55"/>
    <circle cx="-40" cy="104" r="5" fill="#2F80ED" fill-opacity="0.7"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="88" font-size="15" font-weight="700" letter-spacing="3.5" fill="#2F80ED">CYBERSECURITY · GRC · AI GOVERNANCE</text>
    <text x="62" y="152" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#24445D">Wassim Bizid</text>
    <text x="64" y="196" font-size="22" font-weight="600" fill="#4B6A82">Security that is measurable, explainable and usable.</text>
    <g font-size="14" font-weight="700" fill="#24445D">
      <rect x="64" y="226" width="78" height="30" rx="15" fill="#FFFFFF" stroke="#BFD6EA"/>
      <text x="103" y="246" text-anchor="middle">CISSP</text>
      <rect x="152" y="226" width="72" height="30" rx="15" fill="#FFFFFF" stroke="#BFD6EA"/>
      <text x="188" y="246" text-anchor="middle">CISM</text>
      <rect x="234" y="226" width="64" height="30" rx="15" fill="#FFFFFF" stroke="#BFD6EA"/>
      <text x="266" y="246" text-anchor="middle">ITIL</text>
      <rect x="308" y="226" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#BFD6EA"/>
      <text x="393" y="246" text-anchor="middle">Executive Mini-MBA</text>
      <rect x="488" y="226" width="150" height="30" rx="15" fill="#2F80ED"/>
      <text x="563" y="246" text-anchor="middle" fill="#FFFFFF">Dubai · Montréal</text>
    </g>
  </g>
